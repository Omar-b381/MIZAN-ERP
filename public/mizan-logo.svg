<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mizanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#mizanGrad)" filter="url(#shadow)" />

  <!-- Inner Architectural Border -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.25" />

  <!-- Central Pillar of Justice & Balance (الميزان) -->
  <!-- Base -->
  <path d="M48 98 h32 a4 4 0 0 0 4-4 v-2 a4 4 0 0 0-4-4 H48 a4 4 0 0 0-4 4 v2 a4 4 0 0 0 4 4 z" fill="white" />
  <rect x="61" y="38" width="6" height="50" rx="3" fill="white" />

  <!-- Fulcrum Top Ring / Finial -->
  <circle cx="64" cy="36" r="6" fill="url(#goldGrad)" stroke="white" stroke-width="2" />
  <circle cx="64" cy="36" r="2.5" fill="white" />

  <!-- Balanced Cross Beam -->
  <path d="M28 44 C28 44 46 41 64 41 C82 41 100 44 100 44" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Left Scale Chains & Pan -->
  <line x1="32" y1="45" x2="22" y2="64" stroke="white" stroke-width="1.8" stroke-opacity="0.8" />
  <line x1="32" y1="45" x2="42" y2="64" stroke="white" stroke-width="1.8" stroke-opacity="0.8" />
  <path d="M18 64 C18 73 46 73 46 64 Z" fill="url(#goldGrad)" stroke="white" stroke-width="1.5" />

  <!-- Right Scale Chains & Pan -->
  <line x1="96" y1="45" x2="86" y2="64" stroke="white" stroke-width="1.8" stroke-opacity="0.8" />
  <line x1="96" y1="45" x2="106" y2="64" stroke="white" stroke-width="1.8" stroke-opacity="0.8" />
  <path d="M82 64 C82 73 110 73 110 64 Z" fill="url(#goldGrad)" stroke="white" stroke-width="1.5" />
</svg>
